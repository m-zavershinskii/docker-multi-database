version: "3.7"
services:
  ${dbname}:
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
    hostname: "${dbname}"
    container_name: "${dbname}"
    restart: unless-stopped
    network_mode: host
    image: mysql:8.0-debian
    volumes:
      - ./${dbname}/data/:/var/lib/mysql/
      - ./${dbname}/my.cnf:/etc/mysql/my.cnf:ro
      - ./${dbname}/log/:/var/log/mysql/
