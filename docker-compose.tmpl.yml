version: "3.7"
services:
  ${dbname}:
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
    hostname: "${dbname}"
    container_name: "${dbname}"
    restart: unless-stopped
    network_mode: host
    image: mysql:8.0-debian
    volumes:
      - type: bind
        source: ./${dbname}/data/
        target: /var/lib/mysql/
      - type: bind
        source: ./${dbname}/my.cnf
        target: /etc/mysql/my.cnf:ro
      - type: bind
        source: ./${dbname}/log
        target: /var/log/mysql
