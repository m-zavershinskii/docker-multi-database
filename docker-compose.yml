version: "3.7"
services:
  mysql-80-1:
    environment:
      - MYSQL_ROOT_PASSWORD=password
    hostname: "mysql-80-1"
    container_name: "mysql-80-1"
    restart: unless-stopped
    network_mode: host
    image: mysql:8.0-debian
    volumes:
      - type: bind
        source: ./mysql-80-1/data/
        target: /var/lib/mysql/
      - type: bind
        source: ./mysql-80-1/my.cnf
        target: /etc/mysql/my.cnf:ro
      - type: bind
        source: ./mysql-80-1/log
        target: /var/log/mysql
